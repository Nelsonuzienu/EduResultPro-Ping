name: Keep Supabase Awake

on:
  schedule:
    # Runs every 3 days at 06:00 UTC — well inside the 7-day
    # inactivity window that triggers free-tier auto-pause.
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase auth health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with status $STATUS"
          if [ "$STATUS" -ge 500 ]; then
            echo "Supabase returned a server error."
            exit 1
          fi
