name: Keep Supabase Awake

on:
  schedule:
    # Runs at 06:00 UTC every 3 days — well inside the 7-day
    # inactivity window that triggers Supabase free-tier auto-pause.
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write   # needed so this workflow can commit its own log entry

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase auth health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") - ping status $STATUS" >> ping-log.txt
          if [ "$STATUS" -ge 500 ]; then
            echo "Supabase health check failed"
            exit 1
          fi

      - name: Commit log entry
        # This keeps the repo "active" so GitHub never auto-disables
        # the schedule after 60 days of inactivity — the ping running
        # on its own does NOT count as activity, only a real commit does.
        run: |
          git config user.name "keep-alive-bot"
          git config user.email "actions@github.com"
          git add ping-log.txt
          git commit -m "Ping $(date -u +"%Y-%m-%d")" || echo "Nothing to commit"
          git push
